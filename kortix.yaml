# yaml-language-server: $schema=https://kortix.com/schema/kortix.v3.schema.json
kortix_version: 3

project:
  name: churn-risk-scan
  description: A daily churn-risk scan. Scores accounts on usage, support, billing and renewal signals and posts a ranked at-risk list to Slack. Read-only.

default_agent: churn-risk

env:
  optional: [PLAIN_API_KEY]

skills:
  churn-signals: skills/churn-signals

agents:
  churn-risk:
    description: Scores every account for churn risk and posts a ranked at-risk list. Reads Postgres, Plain and Stripe; writes only the Slack post.
    mode: primary
    prompt_file: agents/churn-risk.md
    skills: [churn-signals]
    tools: [read, glob, grep, web_search]
    connectors: all
    secrets: [PLAIN_API_KEY]
    workspace: { project_repository: true }

triggers:
  - slug: daily-churn-scan
    name: Daily churn-risk scan
    on:
      cron: "0 0 6 * * *"
      timezone: UTC
    max_runs_per_day: 1
    overlap: skip
    run:
      agent: churn-risk
      prompt: Load the churn-signals skill and run one complete churn-risk scan.
